/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://lryoqddbyasdtjdrwpvx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_pZbQaJ78di1MH3PUcJfeyw_0vPl43k9";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBAL DATA
===================================================== */

let menuSections = [];
let menuItems = [];
let cart = [];


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   LOAD MENU SECTIONS + ITEMS
===================================================== */

async function loadDynamicMenu(){

    const [
        sectionsResult,
        itemsResult
    ] = await Promise.all([

        supabaseClient
        .from("menu_sections")
        .select("*")
        .eq("active",true)
        .order("sort_order")
        .order("created_at"),

        supabaseClient
        .from("menu_items")
        .select("*")
        .eq("active",true)
        .order("id")

    ]);


    if(sectionsResult.error){

        console.error(
            "Sections Error:",
            sectionsResult.error
        );

        return;

    }


    if(itemsResult.error){

        console.error(
            "Items Error:",
            itemsResult.error
        );

        return;

    }


    menuSections =
        sectionsResult.data || [];


    menuItems =
        itemsResult.data || [];


    renderDynamicMenu();

}


/* =====================================================
   RENDER DYNAMIC MENU
===================================================== */

function renderDynamicMenu(){

    const menu =
        document.getElementById("dynamicMenu");

    if(!menu) return;


    menu.innerHTML = "";


    const mainSections =
        menuSections
        .filter(section => !section.parent_id)
        .sort((a,b) => {

            return (
                Number(a.sort_order || 0) -
                Number(b.sort_order || 0)
            );

        });


    if(mainSections.length === 0){

        menu.innerHTML = `
            <div
            style="
            text-align:center;
            color:#888;
            padding:30px 15px;
            ">
            منویی برای نمایش وجود ندارد.
            </div>
        `;

        return;

    }


    const tabs =
        document.createElement("div");

    tabs.className = "tabs";


    const sectionsContainer =
        document.createElement("div");

    sectionsContainer.className =
        "container";


    mainSections.forEach(
        function(main,index){

            const tabId =
                "dynamic-main-" + main.id;


            const children =
                menuSections
                .filter(
                    section =>
                    section.parent_id === main.id
                )
                .sort((a,b) => {

                    return (
                        Number(a.sort_order || 0) -
                        Number(b.sort_order || 0)
                    );

                });


            const tabButton =
                document.createElement("button");

            tabButton.className =
                "tab-btn" +
                (index === 0 ? " active" : "");


            tabButton.textContent =
                main.name;


            tabButton.onclick =
                function(){

                    showDynamicMain(
                        tabId,
                        tabButton
                    );

                };


            tabs.appendChild(tabButton);


            const section =
                document.createElement("div");

            section.id =
                tabId;

            section.className =
                "section" +
                (index === 0 ? " active" : "");


            const title =
                document.createElement("h2");

            title.textContent =
                main.name;


            section.appendChild(title);


            /*
             * اگر تب اصلی زیرتب داشته باشد
             * فقط زیرتب‌ها نمایش داده می‌شوند.
             */

            if(children.length > 0){

                const subTabs =
                    document.createElement("div");

                subTabs.className =
                    "sub-tabs";


                const subContainer =
                    document.createElement("div");


                children.forEach(
                    function(child,childIndex){

                        const childId =
                            "dynamic-sub-" +
                            child.id;


                        const subButton =
                            document.createElement("button");

                        subButton.className =
                            "sub-tab" +
                            (
                                childIndex === 0
                                ? " active"
                                : ""
                            );


                        subButton.textContent =
                            child.name;


                        subButton.onclick =
                            function(){

                                showDynamicSub(
                                    section,
                                    childId,
                                    subButton
                                );

                            };


                        subTabs.appendChild(
                            subButton
                        );


                        const subSection =
                            document.createElement("div");


                        subSection.id =
                            childId;


                        subSection.className =
                            "sub-section" +
                            (
                                childIndex === 0
                                ? " active"
                                : ""
                            );


                        const childItems =
                            menuItems.filter(
                                item =>
                                item.category === main.name &&
                                item.subcategory === child.name
                            );


                        renderItemsInto(
                            subSection,
                            childItems
                        );


                        subContainer.appendChild(
                            subSection
                        );

                    }
                );


                section.appendChild(
                    subTabs
                );


                section.appendChild(
                    subContainer
                );

            }else{

                /*
                 * تب اصلی بدون زیرتب
                 */

                const mainItems =
                    menuItems.filter(
                        item =>
                        item.category === main.name &&
                        !item.subcategory
                    );


                renderItemsInto(
                    section,
                    mainItems
                );

            }


            sectionsContainer.appendChild(
                section
            );

        }
    );


    menu.appendChild(tabs);

    menu.appendChild(
        sectionsContainer
    );


    triggerReveal();

}


/* =====================================================
   RENDER ITEMS
===================================================== */

function renderItemsInto(container,items){

    container.innerHTML = "";


    if(!items || items.length === 0){

        container.innerHTML = `
            <div
            style="
            text-align:center;
            color:#777;
            padding:20px 5px;
            font-size:13px;
            ">
            آیتمی برای این بخش ثبت نشده است.
            </div>
        `;

        return;

    }


    items.forEach(
        function(item){

            const card =
                document.createElement("div");

            card.className =
                "card";


            const itemInfo =
                document.createElement("div");

            itemInfo.className =
                "item";


            const name =
                document.createElement("span");

            name.textContent =
                item.name;


            itemInfo.appendChild(
                name
            );


            if(item.description){

                const desc =
                    document.createElement("span");

                desc.className =
                    "desc";

                desc.textContent =
                    item.description;


                itemInfo.appendChild(
                    desc
                );

            }


            const price =
                document.createElement("span");

            price.className =
                "price";

            price.textContent =
                Number(item.price)
                .toLocaleString("fa-IR")
                + " تومان";


            const addButton =
                document.createElement("button");

            addButton.className =
                "add-btn";

            addButton.textContent =
                "افزودن";


            addButton.onclick =
                function(){

                    addItem(
                        item.name,
                        item.price
                    );

                };


            card.appendChild(
                itemInfo
            );

            card.appendChild(
                price
            );

            card.appendChild(
                addButton
            );


            container.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   MAIN TAB
===================================================== */

function showDynamicMain(tabId,button){

    document
    .querySelectorAll(".section")
    .forEach(
        function(section){

            section.classList.remove(
                "active"
            );

        }
    );


    document
    .querySelectorAll(".tab-btn")
    .forEach(
        function(btn){

            btn.classList.remove(
                "active"
            );

        }
    );


    const section =
        document.getElementById(tabId);


    if(section){

        section.classList.add(
            "active"
        );

    }


    button.classList.add(
        "active"
    );


    triggerReveal();

}


/* =====================================================
   SUB TAB
===================================================== */

function showDynamicSub(
    parentSection,
    subId,
    button
){

    parentSection
    .querySelectorAll(".sub-section")
    .forEach(
        function(section){

            section.classList.remove(
                "active"
            );

        }
    );


    parentSection
    .querySelectorAll(".sub-tab")
    .forEach(
        function(btn){

            btn.classList.remove(
                "active"
            );

        }
    );


    const sub =
        document.getElementById(subId);


    if(sub){

        sub.classList.add(
            "active"
        );

    }


    button.classList.add(
        "active"
    );


    triggerReveal();

}


/* =====================================================
   ADD ITEM TO CART
===================================================== */

function addItem(name,price){

    price =
        Number(price);


    const existing =
        cart.find(
            item =>
            item.name === name
        );


    if(existing){

        existing.quantity++;

    }else{

        cart.push({

            name:name,

            price:price,

            quantity:1

        });

    }


    updateCart();

    showAddToast(name);

}


/* =====================================================
   TOAST
===================================================== */

function showAddToast(name){

    const toast =
        document.getElementById(
            "addToast"
        );


    toast.textContent =
        "✅ " +
        name +
        " به سبد خرید اضافه شد";


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =====================================================
   CART UPDATE
===================================================== */

function updateCart(){

    const container =
        document.getElementById(
            "cartItems"
        );


    const count =
        document.getElementById(
            "cartCount"
        );


    const totalElement =
        document.getElementById(
            "cartTotal"
        );


    let total = 0;

    let countItems = 0;


    if(cart.length === 0){

        container.innerHTML = `
            <p
            style="
            text-align:center;
            color:#888;
            ">
            سبد خرید خالی است
            </p>
        `;

    }else{

        container.innerHTML = "";


        cart.forEach(
            function(item,index){

                total +=
                    item.price *
                    item.quantity;


                countItems +=
                    item.quantity;


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "cart-item";


                div.innerHTML = `

                <div class="cart-row">

                    <strong>
                        ${escapeHTML(item.name)}
                    </strong>

                    <span class="price">
                        ${formatPrice(
                            item.price *
                            item.quantity
                        )}
                    </span>

                </div>


                <div
                class="cart-row"
                style="margin-top:8px;">

                    <div class="qty">

                        <button
                        onclick="changeQty(${index},-1)">
                        −
                        </button>

                        <span>
                            ${item.quantity}
                        </span>

                        <button
                        onclick="changeQty(${index},1)">
                        +
                        </button>

                    </div>

                    <span
                    style="
                    color:#888;
                    font-size:12px;">

                    ${formatPrice(item.price)}
                    / عدد

                    </span>

                </div>

                `;


                container.appendChild(
                    div
                );

            }
        );

    }


    count.textContent =
        countItems;


    totalElement.textContent =
        formatPrice(total);

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(price){

    return Number(price)
    .toLocaleString("en-US")
    + " تومان";

}


/* =====================================================
   CHANGE QUANTITY
===================================================== */

function changeQty(index,change){

    if(!cart[index]) return;


    cart[index].quantity +=
        change;


    if(cart[index].quantity <= 0){

        cart.splice(
            index,
            1
        );

    }


    updateCart();

}


/* =====================================================
   CART TOGGLE
===================================================== */

function toggleCart(){

    document
    .getElementById("cartPanel")
    .classList.toggle("open");

}


/* =====================================================
   SUBMIT ORDER
===================================================== */

async function submitOrder(){

    const message =
        document.getElementById(
            "orderMessage"
        );


    const button =
        document.getElementById(
            "submitOrder"
        );


    const table =
        document
        .getElementById(
            "tableNumber"
        )
        .value
        .trim();


    message.textContent =
        "";


    message.className =
        "message";


    if(cart.length === 0){

        message.textContent =
            "❌ سبد خرید خالی است.";


        message.classList.add(
            "error"
        );


        return;

    }


    if(!table){

        message.textContent =
            "❌ لطفاً شماره میز را وارد کنید.";


        message.classList.add(
            "error"
        );


        return;

    }


    const total =
        cart.reduce(
            function(sum,item){

                return sum +
                    (
                        item.price *
                        item.quantity
                    );

            },
            0
        );


    button.disabled =
        true;


    button.textContent =
        "در حال ثبت...";


    try{

        const {error} =
            await supabaseClient
            .from("orders")
            .insert([{

                table_number:
                    table,

                items:
                    cart,

                total_price:
                    total,

                status:
                    "new"

            }]);


        if(error){

            console.error(
                "Supabase Error:",
                error
            );

            throw error;

        }


        message.textContent =
            "✅ سفارش با موفقیت ثبت شد.";


        message.classList.add(
            "success"
        );


        cart = [];


        updateCart();


        document
        .getElementById(
            "tableNumber"
        )
        .value = "";


    }catch(error){

        console.error(
            "Supabase Error:",
            error
        );


        message.textContent =
            "❌ سفارش ثبت نشد. دوباره تلاش کنید.";


        message.classList.add(
            "error"
        );


    }finally{

        button.disabled =
            false;


        button.textContent =
            "ثبت سفارش";

    }

}


/* =====================================================
   SCROLL REVEAL
===================================================== */

const observer =
new IntersectionObserver(

    function(entries){

        entries.forEach(
            function(entry){

                if(entry.isIntersecting){

                    entry.target
                    .classList
                    .add("show");

                }

            }
        );

    },

    {
        threshold:.15
    }

);


function triggerReveal(){

    document
    .querySelectorAll(".card")
    .forEach(
        function(card){

            observer.observe(
                card
            );

        }
    );

}
