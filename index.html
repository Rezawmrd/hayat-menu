<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Hayat Complex Menu</title>

<link
href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:auto;
}

body{
    margin:0;
    font-family:'Vazirmatn',sans-serif;
    background:#0a0a0a;
    color:#fff;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
    radial-gradient(
        circle at 15% 15%,
        rgba(212,175,55,.10),
        transparent 35%
    ),

    radial-gradient(
        circle at 85% 25%,
        rgba(212,175,55,.06),
        transparent 40%
    ),

    radial-gradient(
        circle at 50% 90%,
        rgba(212,175,55,.07),
        transparent 45%
    );

    pointer-events:none;
    z-index:0;
}


/* =====================================================
   INTRO
===================================================== */

#intro{
    position:fixed;
    inset:0;

    background:#000;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:9999;

    animation:
        introFade 1.3s ease forwards;

    animation-delay:2.7s;
}

#intro img{
    width:125px;
    height:125px;

    object-fit:cover;

    border-radius:50%;

    border:2px solid #d4af37;

    box-shadow:
        0 0 30px rgba(212,175,55,.35);

    animation:logoFloat 4s ease-in-out infinite;
}

#intro h1{
    color:#d4af37;

    margin:18px 0 0;

    font-size:22px;

    letter-spacing:3px;
}

@keyframes introFade{

    to{
        opacity:0;
        visibility:hidden;
    }

}

@keyframes logoFloat{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }

    100%{
        transform:translateY(0);
    }

}


/* =====================================================
   HEADER
===================================================== */

header{
    position:relative;
    z-index:2;

    text-align:center;

    padding:
        28px
        15px
        20px;

    border-bottom:
        1px solid
        rgba(212,175,55,.18);
}

header img{
    width:82px;
    height:82px;

    object-fit:cover;

    border-radius:50%;

    border:
        1.5px solid
        #d4af37;

    box-shadow:
        0 0 25px
        rgba(212,175,55,.25);
}

header h1{
    margin:
        10px 0 0;

    color:#d4af37;

    font-size:21px;

    letter-spacing:2px;
}

.actions{
    display:flex;

    justify-content:center;

    gap:8px;

    margin-top:13px;
}

.btn{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    background:#141414;

    color:#eee;

    border:
        1px solid
        rgba(255,255,255,.12);

    padding:
        8px 15px;

    border-radius:9px;

    text-decoration:none;

    font-size:13px;

    transition:.25s;
}

.btn:hover{
    border-color:#d4af37;

    color:#d4af37;
}


/* =====================================================
   MAIN MENU
===================================================== */

#dynamicMenu{
    position:relative;

    z-index:1;

    width:100%;

    max-width:650px;

    margin:0 auto;

    padding:
        18px
        14px
        100px;
}


/* =====================================================
   CATEGORY CARDS
===================================================== */

.category-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:11px;

    margin-bottom:20px;
}


.category-card{

    position:relative;

    height:145px;

    border-radius:18px;

    overflow:hidden;

    cursor:pointer;

    border:
        1px solid
        rgba(212,175,55,.20);

    background:#151515;

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

    isolation:isolate;
}

.category-card::before{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.88),
            rgba(0,0,0,.12) 70%
        );

    z-index:1;

}

.category-card:hover{

    transform:translateY(-3px);

    border-color:
        rgba(212,175,55,.65);

}

.category-card.active{

    border:
        1.5px solid
        #d4af37;

    box-shadow:
        0 0 20px
        rgba(212,175,55,.16);

    transform:translateY(-2px);
}

.category-card img{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    object-fit:cover;

    z-index:0;

    transition:
        transform .45s ease;
}

.category-card:hover img{

    transform:scale(1.06);

}

.category-card.active img{

    transform:scale(1.04);

}

.category-content{

    position:absolute;

    z-index:2;

    bottom:12px;

    right:13px;

    left:13px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;
}

.category-name{

    color:#fff;

    font-size:16px;

    font-weight:600;

    text-shadow:
        0 2px 8px #000;
}

.category-arrow{

    width:27px;
    height:27px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(212,175,55,.95);

    color:#000;

    font-size:15px;

    font-weight:700;
}


/* =====================================================
   PRODUCTS AREA
===================================================== */

.menu-content{

    background:
        rgba(16,16,16,.92);

    border:
        1px solid
        rgba(212,175,55,.12);

    border-radius:20px;

    padding:
        17px 13px;

    min-height:100px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.22);
}

.menu-heading{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin:
        0 4px
        15px;

    padding-bottom:12px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.menu-heading h2{

    margin:0;

    font-size:19px;

    color:#d4af37;
}

.menu-heading span{

    color:#777;

    font-size:11px;
}


/* =====================================================
   SUB TABS
===================================================== */

.sub-tabs{

    display:flex;

    gap:8px;

    overflow-x:auto;

    padding:
        2px
        2px
        12px;

    margin-bottom:3px;

    scrollbar-width:none;
}

.sub-tabs::-webkit-scrollbar{
    display:none;
}

.sub-tab{

    flex:
        0 0 auto;

    background:#151515;

    color:#bbb;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:10px;

    padding:
        8px 14px;

    cursor:pointer;

    font-family:
        'Vazirmatn',
        sans-serif;

    font-size:12px;

    transition:.25s;
}

.sub-tab.active{

    background:
        rgba(212,175,55,.10);

    border-color:#d4af37;

    color:#d4af37;
}


/* =====================================================
   SUB SECTIONS
===================================================== */

.sub-section{
    display:none;
}

.sub-section.active{
    display:block;
}


/* =====================================================
   PRODUCT CARD
===================================================== */

.card{

    background:
        #151515;

    padding:
        12px;

    margin-bottom:8px;

    border-radius:13px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    border:
        1px solid
        rgba(255,255,255,.055);

    opacity:0;

    transform:translateY(10px);

    transition:
        opacity .35s ease,
        transform .35s ease,
        border-color .25s ease;
}

.card.show{

    opacity:1;

    transform:translateY(0);
}

.card:hover{

    border-color:
        rgba(212,175,55,.28);
}

.item{

    min-width:0;

    flex:1;

    display:flex;

    flex-direction:column;
}

.item span:first-child{

    color:#f4f4f4;

    font-size:14px;

    font-weight:500;
}

.desc{

    font-size:11px;

    color:#858585;

    margin-top:4px;

    line-height:1.7;
}

.price{

    color:#d4af37;

    white-space:nowrap;

    font-size:13px;
}

.add-btn{

    background:
        transparent;

    color:#d4af37;

    border:
        1px solid
        #d4af37;

    border-radius:8px;

    padding:
        6px 10px;

    cursor:pointer;

    font-family:
        'Vazirmatn',
        sans-serif;

    font-size:12px;

    white-space:nowrap;

    transition:.25s;
}

.add-btn:hover{

    background:#d4af37;

    color:#000;
}


/* =====================================================
   CART
===================================================== */

.cart-box{

    position:fixed;

    left:14px;

    bottom:14px;

    z-index:5000;
}

.cart-toggle{

    background:#d4af37;

    color:#000;

    border:none;

    border-radius:30px;

    padding:
        11px 17px;

    font-family:
        'Vazirmatn',
        sans-serif;

    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 5px 25px
        rgba(212,175,55,.25);
}

#cartCount{

    background:#000;

    color:#d4af37;

    border-radius:50%;

    padding:
        2px 7px;

    margin-right:5px;
}

.cart-panel{

    position:absolute;

    bottom:58px;

    left:0;

    width:320px;

    max-width:
        calc(100vw - 28px);

    max-height:70vh;

    overflow-y:auto;

    background:#111;

    border:
        1px solid
        #d4af37;

    border-radius:15px;

    padding:15px;

    opacity:0;

    visibility:hidden;

    transform:translateY(12px);

    transition:.3s;
}

.cart-panel.open{

    opacity:1;

    visibility:visible;

    transform:translateY(0);
}

.cart-title{

    color:#d4af37;

    font-size:18px;

    font-weight:700;

    margin-bottom:12px;

    text-align:center;
}

.cart-item{

    background:#181818;

    border-radius:10px;

    padding:10px;

    margin-bottom:8px;
}

.cart-row{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;
}

.qty{

    display:flex;

    align-items:center;

    gap:7px;
}

.qty button{

    width:27px;
    height:27px;

    border-radius:7px;

    border:
        1px solid
        #d4af37;

    background:#151515;

    color:#d4af37;

    cursor:pointer;

    font-size:17px;
}

.cart-total{

    display:flex;

    justify-content:space-between;

    align-items:center;

    border-top:
        1px solid
        #333;

    padding-top:12px;

    margin-top:12px;

    color:#fff;
}

.cart-total strong{

    color:#d4af37;
}


/* =====================================================
   ORDER FORM
===================================================== */

.order-form{

    margin-top:15px;
}

.order-form label{

    display:block;

    margin-bottom:7px;

    color:#ccc;

    font-size:13px;
}

.order-form input{

    width:100%;

    background:#0b0b0b;

    border:
        1px solid
        #333;

    color:#fff;

    border-radius:8px;

    padding:11px;

    font-family:
        'Vazirmatn',
        sans-serif;

    margin-bottom:10px;
}

.order-form input:focus{

    outline:none;

    border-color:#d4af37;
}

.submit-order{

    width:100%;

    background:#d4af37;

    color:#000;

    border:none;

    border-radius:9px;

    padding:11px;

    font-family:
        'Vazirmatn',
        sans-serif;

    font-weight:700;

    cursor:pointer;
}

.submit-order:disabled{

    opacity:.6;

    cursor:not-allowed;
}


/* =====================================================
   TOAST
===================================================== */

#addToast{

    position:fixed;

    top:20px;

    right:50%;

    transform:
        translate(50%,-20px);

    background:#151515;

    color:#fff;

    border:
        1px solid
        #d4af37;

    border-radius:10px;

    padding:
        10px 18px;

    z-index:99999;

    opacity:0;

    visibility:hidden;

    transition:.3s;

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.5);

    font-size:13px;
}

#addToast.show{

    opacity:1;

    visibility:visible;

    transform:
        translate(50%,0);
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    position:relative;

    z-index:1;

    text-align:center;

    padding:
        10px 10px 30px;

    color:#777;
}

.footer .btn{

    border:
        1px solid
        rgba(212,175,55,.55);

    color:#d4af37;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:480px){

    header{
        padding-top:22px;
    }

    header img{
        width:72px;
        height:72px;
    }

    header h1{
        font-size:18px;
    }

    #dynamicMenu{
        padding:
            15px
            10px
            95px;
    }

    .category-grid{

        grid-template-columns:
            repeat(2,1fr);

        gap:8px;
    }

    .category-card{

        height:125px;

        border-radius:15px;
    }

    .category-name{
        font-size:14px;
    }

    .category-content{
        bottom:10px;
        right:10px;
        left:10px;
    }

    .category-arrow{
        width:24px;
        height:24px;
        font-size:13px;
    }

    .menu-content{
        padding:14px 10px;
        border-radius:17px;
    }

    .menu-heading h2{
        font-size:17px;
    }

    .card{
        padding:10px;
    }

    .item span:first-child{
        font-size:13px;
    }

    .price{
        font-size:11px;
    }

    .add-btn{
        padding:
            5px 8px;
    }

}

@media(min-width:600px){

    .category-grid{

        grid-template-columns:
            repeat(3,1fr);
    }

    .category-card{
        height:150px;
    }
}

</style>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://lryoqddbyasdtjdrwpvx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_pZbQaJ78di1MH3PUcJfeyw_0vPl43k9";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBAL DATA
===================================================== */

let menuSections = [];

let menuItems = [];

let cart = [];


/* =====================================================
   CATEGORY IMAGES
===================================================== */

const categoryImages = {

    "صبحانه":
    "https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?auto=format&fit=crop&w=900&q=80",

    "غذا":
    "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80",

    "سالاد":
    "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=900&q=80",

    "کیک":
    "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=900&q=80",

    "نوشیدنی گرم":
    "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=80",

    "نوشیدنی سرد":
    "https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=900&q=80"

};


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* =====================================================
   LOAD MENU
===================================================== */

async function loadDynamicMenu(){

    const [
        sectionsResult,
        itemsResult
    ] = await Promise.all([

        supabaseClient
        .from("menu_sections")
        .select("*")
        .eq("active",true)
        .order("sort_order")
        .order("created_at"),

        supabaseClient
        .from("menu_items")
        .select("*")
        .eq("active",true)
        .order("id")

    ]);


    if(sectionsResult.error){

        console.error(
            "Sections Error:",
            sectionsResult.error
        );

        return;

    }


    if(itemsResult.error){

        console.error(
            "Items Error:",
            itemsResult.error
        );

        return;

    }


    menuSections =
        sectionsResult.data || [];


    menuItems =
        itemsResult.data || [];


    renderDynamicMenu();

}


/* =====================================================
   RENDER DYNAMIC MENU
===================================================== */

function renderDynamicMenu(){

    const menu =
        document.getElementById(
            "dynamicMenu"
        );

    if(!menu) return;


    menu.innerHTML = "";


    const mainSections =
        menuSections

        .filter(
            section =>
            !section.parent_id
        )

        .sort(
            (a,b) =>
            Number(a.sort_order || 0) -
            Number(b.sort_order || 0)
        );


    if(mainSections.length === 0){

        menu.innerHTML = `

            <div
            style="
            text-align:center;
            color:#888;
            padding:30px 15px;
            ">

                منویی برای نمایش وجود ندارد.

            </div>

        `;

        return;

    }


    /* =================================================
       CATEGORY GRID
    ================================================= */

    const categoryGrid =
        document.createElement(
            "div"
        );

    categoryGrid.className =
        "category-grid";


    /* =================================================
       MENU CONTENT
    ================================================= */

    const menuContent =
        document.createElement(
            "div"
        );

    menuContent.className =
        "menu-content";


    mainSections.forEach(
        function(main,index){

            const sectionId =
                "dynamic-main-" +
                main.id;


            const children =
                menuSections

                .filter(
                    section =>
                    section.parent_id === main.id
                )

                .sort(
                    (a,b) =>
                    Number(a.sort_order || 0) -
                    Number(b.sort_order || 0)
                );


            /* =========================================
               CATEGORY CARD
            ========================================= */

            const categoryCard =
                document.createElement(
                    "div"
                );

            categoryCard.className =
                "category-card" +
                (
                    index === 0
                    ? " active"
                    : ""
                );


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                categoryImages[main.name] ||
                "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=900&q=80";


            image.alt =
                main.name;


            image.loading =
                "lazy";


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "category-content";


            const name =
                document.createElement(
                    "span"
                );

            name.className =
                "category-name";

            name.textContent =
                main.name;


            const arrow =
                document.createElement(
                    "span"
                );

            arrow.className =
                "category-arrow";

            arrow.innerHTML =
                "←";


            content.appendChild(
                name
            );

            content.appendChild(
                arrow
            );


            categoryCard.appendChild(
                image
            );

            categoryCard.appendChild(
                content
            );


            categoryCard.onclick =
                function(){

                    showDynamicMain(
                        main,
                        categoryCard
                    );

                };


            categoryGrid.appendChild(
                categoryCard
            );


            /* =========================================
               SECTION
            ========================================= */

            const section =
                document.createElement(
                    "div"
                );


            section.id =
                sectionId;


            section.className =
                "dynamic-section";


            section.style.display =
                index === 0
                ? "block"
                : "none";


            /* =========================================
               HEADING
            ========================================= */

            const heading =
                document.createElement(
                    "div"
                );

            heading.className =
                "menu-heading";


            heading.innerHTML = `

                <h2>
                    ${escapeHTML(main.name)}
                </h2>

                <span>
                    انتخاب کنید
                </span>

            `;


            section.appendChild(
                heading
            );


            /* =========================================
               CHILDREN
            ========================================= */

            if(children.length > 0){

                const subTabs =
                    document.createElement(
                        "div"
                    );

                subTabs.className =
                    "sub-tabs";


                const subContainer =
                    document.createElement(
                        "div"
                    );


                children.forEach(
                    function(
                        child,
                        childIndex
                    ){

                        const childId =
                            "dynamic-sub-" +
                            child.id;


                        const subButton =
                            document.createElement(
                                "button"
                            );


                        subButton.className =
                            "sub-tab" +

                            (
                                childIndex === 0
                                ? " active"
                                : ""
                            );


                        subButton.textContent =
                            child.name;


                        const subSection =
                            document.createElement(
                                "div"
                            );


                        subSection.id =
                            childId;


                        subSection.className =
                            "sub-section" +

                            (
                                childIndex === 0
                                ? " active"
                                : ""
                            );


                        const childItems =
                            menuItems.filter(
                                item =>

                                item.category ===
                                main.name &&

                                item.subcategory ===
                                child.name
                            );


                        renderItemsInto(
                            subSection,
                            childItems
                        );


                        subButton.onclick =
                            function(){

                                showDynamicSub(
                                    section,
                                    subSection,
                                    subButton
                                );

                            };


                        subTabs.appendChild(
                            subButton
                        );


                        subContainer.appendChild(
                            subSection
                        );

                    }
                );


                section.appendChild(
                    subTabs
                );


                section.appendChild(
                    subContainer
                );

            }

            else{

                const mainItems =
                    menuItems.filter(
                        item =>

                        item.category ===
                        main.name &&

                        !item.subcategory
                    );


                const itemContainer =
                    document.createElement(
                        "div"
                    );


                renderItemsInto(
                    itemContainer,
                    mainItems
                );


                section.appendChild(
                    itemContainer
                );

            }


            menuContent.appendChild(
                section
            );

        }
    );


    menu.appendChild(
        categoryGrid
    );


    menu.appendChild(
        menuContent
    );


    triggerReveal();

}


/* =====================================================
   SHOW MAIN CATEGORY
===================================================== */

function showDynamicMain(
    selectedMain,
    selectedCard
){

    /* ---------------------------------------------
       Update category cards
    --------------------------------------------- */

    document
    .querySelectorAll(
        ".category-card"
    )
    .forEach(
        function(card){

            card.classList.remove(
                "active"
            );

        }
    );


    selectedCard.classList.add(
        "active"
    );


    /* ---------------------------------------------
       Update sections
    --------------------------------------------- */

    const sections =
        document.querySelectorAll(
            ".dynamic-section"
        );


    sections.forEach(
        function(section){

            section.style.display =
                "none";

        }
    );


    const selectedSection =
        document.getElementById(
            "dynamic-main-" +
            selectedMain.id
        );


    if(selectedSection){

        selectedSection.style.display =
            "block";

    }


    /*
     * عمداً هیچ scroll یا scrollIntoView
     * اینجا استفاده نشده.
     *
     * بنابراین صفحه با انتخاب دسته
     * پایین نمی‌پرد.
     */

    triggerReveal();

}


/* =====================================================
   SHOW SUB CATEGORY
===================================================== */

function showDynamicSub(
    parentSection,
    selectedSub,
    selectedButton
){

    parentSection
    .querySelectorAll(
        ".sub-section"
    )
    .forEach(
        function(section){

            section.classList.remove(
                "active"
            );

        }
    );


    parentSection
    .querySelectorAll(
        ".sub-tab"
    )
    .forEach(
        function(button){

            button.classList.remove(
                "active"
            );

        }
    );


    selectedSub.classList.add(
        "active"
    );


    selectedButton.classList.add(
        "active"
    );


    triggerReveal();

}


/* =====================================================
   RENDER ITEMS
===================================================== */

function renderItemsInto(
    container,
    items
){

    container.innerHTML = "";


    if(
        !items ||
        items.length === 0
    ){

        container.innerHTML = `

            <div
            style="
            text-align:center;
            color:#777;
            padding:20px 5px;
            font-size:13px;
            ">

                آیتمی برای این بخش ثبت نشده است.

            </div>

        `;

        return;

    }


    items.forEach(
        function(item){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const itemInfo =
                document.createElement(
                    "div"
                );


            itemInfo.className =
                "item";


            const name =
                document.createElement(
                    "span"
                );


            name.textContent =
                item.name;


            itemInfo.appendChild(
                name
            );


            if(item.description){

                const desc =
                    document.createElement(
                        "span"
                    );


                desc.className =
                    "desc";


                desc.textContent =
                    item.description;


                itemInfo.appendChild(
                    desc
                );

            }


            const price =
                document.createElement(
                    "span"
                );


            price.className =
                "price";


            price.textContent =
                Number(
                    item.price
                )
                .toLocaleString(
                    "fa-IR"
                )
                +
                " تومان";


            const addButton =
                document.createElement(
                    "button"
                );


            addButton.className =
                "add-btn";


            addButton.textContent =
                "افزودن";


            addButton.onclick =
                function(){

                    addItem(
                        item.name,
                        item.price
                    );

                };


            card.appendChild(
                itemInfo
            );


            card.appendChild(
                price
            );


            card.appendChild(
                addButton
            );


            container.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   ADD ITEM
===================================================== */

function addItem(
    name,
    price
){

    price =
        Number(price);


    const existing =
        cart.find(
            item =>
            item.name === name
        );


    if(existing){

        existing.quantity++;

    }

    else{

        cart.push({

            name:name,

            price:price,

            quantity:1

        });

    }


    updateCart();

    showAddToast(name);

}


/* =====================================================
   TOAST
===================================================== */

function showAddToast(name){

    const toast =
        document.getElementById(
            "addToast"
        );


    toast.textContent =
        name +
        " به سبد خرید اضافه شد";


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =====================================================
   UPDATE CART
===================================================== */

function updateCart(){

    const container =
        document.getElementById(
            "cartItems"
        );


    const count =
        document.getElementById(
            "cartCount"
        );


    const totalElement =
        document.getElementById(
            "cartTotal"
        );


    let total = 0;

    let countItems = 0;


    if(cart.length === 0){

        container.innerHTML = `

            <p
            style="
            text-align:center;
            color:#888;
            ">

                سبد خرید خالی است

            </p>

        `;

    }

    else{

        container.innerHTML = "";


        cart.forEach(
            function(
                item,
                index
            ){

                total +=
                    item.price *
                    item.quantity;


                countItems +=
                    item.quantity;


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "cart-item";


                div.innerHTML = `

                    <div
                    class="cart-row">

                        <strong>

                            ${escapeHTML(
                                item.name
                            )}

                        </strong>

                        <span class="price">

                            ${formatPrice(
                                item.price *
                                item.quantity
                            )}

                        </span>

                    </div>


                    <div
                    class="cart-row"
                    style="margin-top:8px;">

                        <div class="qty">

                            <button
                            onclick="changeQty(${index},-1)">

                                −

                            </button>

                            <span>

                                ${item.quantity}

                            </span>

                            <button
                            onclick="changeQty(${index},1)">

                                +

                            </button>

                        </div>


                        <span
                        style="
                        color:#888;
                        font-size:12px;">

                            ${formatPrice(
                                item.price
                            )}
                            / عدد

                        </span>

                    </div>

                `;


                container.appendChild(
                    div
                );

            }
        );

    }


    count.textContent =
        countItems;


    totalElement.textContent =
        formatPrice(total);

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(price){

    return Number(price)
    .toLocaleString("en-US")
    + " تومان";

}


/* =====================================================
   CHANGE QUANTITY
===================================================== */

function changeQty(
    index,
    change
){

    if(!cart[index])
        return;


    cart[index].quantity +=
        change;


    if(
        cart[index].quantity <= 0
    ){

        cart.splice(
            index,
            1
        );

    }


    updateCart();

}


/* =====================================================
   CART TOGGLE
===================================================== */

function toggleCart(){

    document
    .getElementById(
        "cartPanel"
    )
    .classList.toggle(
        "open"
    );

}


/* =====================================================
   SUBMIT ORDER
===================================================== */

async function submitOrder(){

    const message =
        document.getElementById(
            "orderMessage"
        );


    const button =
        document.getElementById(
            "submitOrder"
        );


    const table =
        document
        .getElementById(
            "tableNumber"
        )
        .value
        .trim();


    message.textContent =
        "";


    message.className =
        "message";


    if(cart.length === 0){

        message.textContent =
            "سبد خرید خالی است.";


        message.classList.add(
            "error"
        );


        return;

    }


    if(!table){

        message.textContent =
            "لطفاً شماره میز را وارد کنید.";


        message.classList.add(
            "error"
        );


        return;

    }


    const total =
        cart.reduce(
            function(
                sum,
                item
            ){

                return sum +
                    (
                        item.price *
                        item.quantity
                    );

            },
            0
        );


    button.disabled =
        true;


    button.textContent =
        "در حال ثبت...";


    try{

        const {error} =
            await supabaseClient

            .from("orders")

            .insert([{

                table_number:
                    table,

                items:
                    cart,

                total_price:
                    total,

                status:
                    "new"

            }]);


        if(error){

            console.error(
                "Supabase Error:",
                error
            );

            throw error;

        }


        message.textContent =
            "سفارش با موفقیت ثبت شد.";


        message.classList.add(
            "success"
        );


        cart = [];


        updateCart();


        document
        .getElementById(
            "tableNumber"
        )
        .value = "";


    }

    catch(error){

        console.error(
            "Supabase Error:",
            error
        );


        message.textContent =
            "سفارش ثبت نشد. دوباره تلاش کنید.";


        message.classList.add(
            "error"
        );

    }

    finally{

        button.disabled =
            false;


        button.textContent =
            "ثبت سفارش";

    }

}


/* =====================================================
   SCROLL REVEAL
===================================================== */

const observer =
new IntersectionObserver(

    function(entries){

        entries.forEach(
            function(entry){

                if(
                    entry.isIntersecting
                ){

                    entry.target
                    .classList
                    .add("show");

                }

            }
        );

    },

    {
        threshold:.05
    }

);


function triggerReveal(){

    document
    .querySelectorAll(
        ".card"
    )
    .forEach(
        function(card){

            observer.observe(
                card
            );

        }
    );

}

        await loadDynamicMenu();
