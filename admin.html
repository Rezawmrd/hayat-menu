<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAYAT | پنل مدیریت</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
box-sizing:border-box;
}


body{
margin:0;
font-family:'Vazirmatn',sans-serif;
background:#090909;
color:#fff;
min-height:100vh;
}


body::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
radial-gradient(circle at 20% 20%,rgba(212,175,55,.10),transparent 40%),
radial-gradient(circle at 80% 70%,rgba(212,175,55,.07),transparent 45%);
}


.header{
position:relative;
z-index:1;
padding:25px 18px;
text-align:center;
border-bottom:1px solid rgba(212,175,55,.25);
background:rgba(10,10,10,.9);
}


.logo{
width:75px;
height:75px;
border-radius:50%;
object-fit:cover;
border:2px solid #d4af37;
}


.header h1{
margin:10px 0 3px;
color:#d4af37;
}


.header p{
margin:0;
color:#888;
font-size:13px;
}


.container{
position:relative;
z-index:1;
width:min(1000px,100%);
margin:auto;
padding:20px;
}


.main-tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}


.main-tab{
flex:1;
padding:12px;
background:#151515;
color:#aaa;
border:1px solid #333;
border-radius:10px;
font-family:inherit;
cursor:pointer;
}


.main-tab.active{
color:#d4af37;
border-color:#d4af37;
}


.section-hide{
display:none;
}


.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
margin-bottom:20px;
flex-wrap:wrap;
}


.stats{
display:flex;
gap:10px;
flex-wrap:wrap;
}


.stat{
background:#151515;
border:1px solid #292929;
border-radius:10px;
padding:10px 15px;
}


.stat span{
color:#888;
font-size:12px;
}


.stat strong{
display:block;
color:#d4af37;
font-size:20px;
}


.refresh,
.logout{
background:#151515;
padding:10px 16px;
border-radius:9px;
font-family:inherit;
cursor:pointer;
}


.refresh{
color:#d4af37;
border:1px solid #d4af37;
}


.logout{
color:#e74c3c;
border:1px solid #633;
}


.filters{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:15px;
}


.filter{
background:#151515;
color:#aaa;
border:1px solid #333;
border-radius:20px;
padding:8px 15px;
font-family:inherit;
cursor:pointer;
}


.filter.active{
color:#d4af37;
border-color:#d4af37;
}


.orders{
display:flex;
flex-direction:column;
gap:12px;
}


.order{
background:#121212;
border:1px solid #292929;
border-radius:14px;
padding:16px;
}


.order.new{
border-right:3px solid #d4af37;
}


.order.preparing{
border-right:3px solid #3498db;
}


.order.ready{
border-right:3px solid #2ecc71;
}


.order.cancelled{
border-right:3px solid #e74c3c;
}

    .order-head{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:12px;
}


.order-id{
color:#d4af37;
font-weight:700;
}


.table{
background:#1d1d1d;
border:1px solid #333;
border-radius:8px;
padding:6px 10px;
}


.items{
border-top:1px solid #292929;
border-bottom:1px solid #292929;
padding:8px 0;
margin-bottom:12px;
}


.item{
display:flex;
justify-content:space-between;
gap:10px;
padding:8px 0;
}


.item-price{
white-space:nowrap;
}


.total{
display:flex;
justify-content:space-between;
font-size:17px;
}


.total strong{
color:#d4af37;
}


.order-actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:15px;
}


.status-btn{
flex:1;
min-width:120px;
background:#181818;
color:#ddd;
border:1px solid #333;
border-radius:8px;
padding:9px;
font-family:inherit;
cursor:pointer;
}


.status-btn:hover{
border-color:#d4af37;
color:#d4af37;
}


.empty,
.loading{
text-align:center;
padding:50px;
color:#777;
}


.toast{
position:fixed;
top:20px;
right:50%;
transform:translateX(50%);
background:#171717;
border:1px solid #d4af37;
padding:12px 20px;
border-radius:10px;
opacity:0;
transition:.3s;
}


.toast.show{
opacity:1;
}


</style>

</head>


<body>


<header class="header">

<img
class="logo"
src="file_000000005f7471fdbdd33eefd3f2e476.png"
>


<h1>HAYAT COMPLEX</h1>

<p>
پنل مدیریت سفارش‌ها
</p>


</header>


<main class="container">


<div class="main-tabs">


<button
class="main-tab active"
onclick="showPanel('ordersPanel',this)">

📦 سفارش‌ها

</button>



<button
class="main-tab"
onclick="showPanel('menuPanel',this)">

🍽 مدیریت منو

</button>


</div>



<div id="ordersPanel">


<div class="top-bar">


<div class="stats">


<div class="stat">

<span>
کل سفارش‌ها
</span>

<strong id="totalOrders">
0
</strong>

</div>



<div class="stat">

<span>
سفارش جدید
</span>

<strong id="newOrders">
0
</strong>

</div>



<div class="stat">

<span>
در حال آماده‌سازی
</span>

<strong id="preparingOrders">
0
</strong>

</div>


</div>



<div style="display:flex;gap:8px;">


<button
class="refresh"
onclick="loadOrders()">

🔄 بروزرسانی

</button>


<button
class="logout"
onclick="logout()">

خروج

</button>


</div>


</div>



<div class="filters">


<button
class="filter active"
onclick="setFilter('all',this)">

همه

</button>


<button
class="filter"
onclick="setFilter('new',this)">

🟡 جدید

</button>


<button
class="filter"
onclick="setFilter('preparing',this)">

🔵 آماده‌سازی

</button>


<button
class="filter"
onclick="setFilter('ready',this)">

🟢 آماده شد

</button>


<button
class="filter"
onclick="setFilter('cancelled',this)">

🔴 لغو شده

</button>


</div>



<div id="orders" class="orders">

<div class="loading">

در حال دریافت سفارش‌ها...

</div>

</div>


</div>



<div id="menuPanel" style="display:none">


<h2 style="color:#d4af37">

🍽 مدیریت منو

</h2>



<div id="menuItems" class="orders">


<div class="loading">

در حال دریافت منو...

</div>


</div>


</div>

    <div id="toast" class="toast"></div>


</main>



<script>


const SUPABASE_URL =
"https://lryoqddbyasdtjdrwpvx.supabase.co";


const SUPABASE_KEY =
"sb_publishable_pZbQaJ78di1MH3PUcJfeyw_0vPl43k9";


const ADMIN_UID =
"c7916c81-caaa-4050-bcae-9d0546bebb96";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



let orders=[];

let currentFilter="all";

let menuItems=[];



async function checkAdmin(){

const {
data,
error
}=await supabaseClient.auth.getSession();


if(error || !data.session){

window.location.href="login.html";

return false;

}


if(data.session.user.id !== ADMIN_UID){

await supabaseClient.auth.signOut();

window.location.href="login.html";

return false;

}


return true;

}




async function loadOrders(){

if(!await checkAdmin()){
return;
}


const {
data,
error
}=await supabaseClient

.from("orders")

.select("*")

.order(
"created_at",
{
ascending:false
}
);



if(error){

showToast("❌ دریافت سفارش‌ها انجام نشد");

return;

}



orders=data || [];


updateStats();

renderOrders();

}




async function loadMenuItems(){

const {
data,
error
}=await supabaseClient

.from("menu_items")

.select("*")

.order("id");



if(error){

showToast("❌ دریافت منو انجام نشد");

return;

}


menuItems=data || [];


renderMenuItems();

}




function renderMenuItems(){

const container =
document.getElementById("menuItems");


if(!container)return;


if(menuItems.length===0){

container.innerHTML=`

<div class="empty">

منویی وجود ندارد

</div>

`;

return;

}



container.innerHTML="";


menuItems.forEach(item=>{


container.innerHTML += `

<div class="order">


<div class="order-head">


<strong style="color:#d4af37">

${item.name}

</strong>


<span>

${item.category || "-"}

</span>


</div>



<label style="color:#aaa">

قیمت

</label>


<input

id="price-${item.id}"

value="${item.price}"

type="number"

style="
width:100%;
margin-top:5px;
padding:10px;
background:#090909;
color:#fff;
border:1px solid #333;
border-radius:8px;
"


>



<button

class="status-btn"

onclick="updateMenuPrice(${item.id})"

>

💾 ذخیره قیمت

</button>



<button

class="status-btn"

onclick="toggleMenuActive(${item.id},${item.active})"

>

${item.active ? "⏸ غیرفعال کردن":"▶️ فعال کردن"}

</button>



</div>

`;

});


}





async function updateMenuPrice(id){

const price =
Number(
document.getElementById("price-"+id).value
);



const {
error
}=await supabaseClient

.from("menu_items")

.update({
price:price
})

.eq("id",id);



if(error){

showToast("❌ ذخیره نشد");

return;

}


showToast("✅ قیمت ذخیره شد");

loadMenuItems();

}




async function toggleMenuActive(id,status){


const {
error
}=await supabaseClient

.from("menu_items")

.update({
active:!status
})

.eq("id",id);



if(error){

showToast("❌ تغییر وضعیت نشد");

return;

}


showToast("✅ وضعیت تغییر کرد");

loadMenuItems();

}




function updateStats(){

document.getElementById("totalOrders").innerText =
orders.length;


document.getElementById("newOrders").innerText =
orders.filter(o=>o.status==="new").length;


document.getElementById("preparingOrders").innerText =
orders.filter(o=>o.status==="preparing").length;

}




function setFilter(filter,btn){

currentFilter=filter;


document.querySelectorAll(".filter")
.forEach(
b=>b.classList.remove("active")
);


btn.classList.add("active");


renderOrders();

}




function renderOrders(){

const container =
document.getElementById("orders");


let list=orders;


if(currentFilter!=="all"){

list=orders.filter(
o=>o.status===currentFilter
);

}



if(list.length===0){

container.innerHTML=`

<div class="empty">

📋 سفارشی وجود ندارد

</div>

`;

return;

}


container.innerHTML="";


list.forEach(order=>{

container.innerHTML += createOrderHTML(order);

});


}

    function createOrderHTML(order){

let items="";


(order.items || []).forEach(item=>{

items += `

<div class="item">

<div>

${escapeHTML(item.name)}

<br>

<small>
تعداد:
${item.quantity || 1}
</small>

</div>


<div class="item-price">

${formatNumber(
(item.price || 0) *
(item.quantity || 1)
)}

</div>

</div>

`;

});



return `

<div class="order ${order.status}">


<div class="order-head">


<div>

<span class="order-id">

سفارش #${order.id}

</span>


<br>


<small>
${formatDate(order.created_at)}
</small>


</div>



<div class="table">

🪑 میز:
${order.table_number}

</div>


</div>



<div class="items">

${items}

</div>



<div class="total">

<span>
مبلغ کل
</span>


<strong>

${formatNumber(order.total_price)}
تومان

</strong>


</div>



<div class="order-actions">


<button class="status-btn"
onclick="changeStatus(${order.id},'new')">

🟡 جدید

</button>



<button class="status-btn"
onclick="changeStatus(${order.id},'preparing')">

🔵 آماده‌سازی

</button>



<button class="status-btn"
onclick="changeStatus(${order.id},'ready')">

🟢 آماده شد

</button>



<button class="status-btn"
onclick="changeStatus(${order.id},'cancelled')">

🔴 لغو

</button>



<button class="status-btn"
onclick="printInvoice(${order.id})">

🖨 چاپ فاکتور

</button>



<button class="status-btn"
onclick="deleteOrder(${order.id})">

🗑 حذف

</button>


</div>


</div>

`;

}




async function changeStatus(id,status){

const {
error
}=await supabaseClient

.from("orders")

.update({
status:status
})

.eq("id",id);



if(error){

showToast("❌ تغییر وضعیت نشد");

return;

}



let order =
orders.find(o=>o.id===id);


if(order){

order.status=status;

}


renderOrders();

showToast("✅ وضعیت تغییر کرد");

}





async function deleteOrder(id){

if(!confirm("حذف این سفارش؟"))
return;



const {
error
}=await supabaseClient

.from("orders")

.delete()

.eq("id",id);



if(error){

showToast("❌ حذف نشد");

return;

}



orders =
orders.filter(
o=>o.id!==id
);



renderOrders();

showToast("🗑 حذف شد");

}





function formatNumber(num){

return Number(num || 0)
.toLocaleString("fa-IR");

}



function formatDate(date){

if(!date)
return "";


return new Date(date)
.toLocaleString("fa-IR");

}





function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}




function showToast(msg){

const toast =
document.getElementById("toast");


toast.innerText=msg;


toast.classList.add("show");


setTimeout(()=>{

toast.classList.remove("show");

},2000);

}




async function logout(){

await supabaseClient.auth.signOut();

window.location.href="login.html";

}





function printInvoice(id){

const order =
orders.find(o=>o.id===id);


if(!order)
return;


let rows="";


order.items.forEach(item=>{


rows += `

<tr>

<td>${item.name}</td>

<td>${item.quantity || 1}</td>

<td>
${formatNumber(
item.price *
(item.quantity || 1)
)}
</td>

</tr>

`;

});



let win =
window.open(
"",
"_blank",
"width=350,height=600"
);



win.document.write(`

<html lang="fa" dir="rtl">

<head>

<style>

body{
font-family:tahoma;
width:80mm;
text-align:center;
}

table{
width:100%;
}

td{
padding:5px;
border-bottom:1px dashed #999;
}

</style>

</head>


<body>


<h2>
HAYAT COMPLEX
</h2>


<p>
سفارش #${order.id}
</p>


<p>
میز ${order.table_number}
</p>


<hr>


<table>

${rows}

</table>


<hr>


<h3>

${formatNumber(order.total_price)}
تومان

</h3>


</body>

</html>

`);



win.document.close();


setTimeout(()=>{

win.print();

win.close();

},500);


}





function showPanel(id,btn){

document.getElementById("ordersPanel")
.style.display="none";


document.getElementById("menuPanel")
.style.display="none";



document.getElementById(id)
.style.display="block";



document.querySelectorAll(".main-tab")
.forEach(
b=>b.classList.remove("active")
);



btn.classList.add("active");

}





setInterval(()=>{

loadOrders();

},15000);





checkAdmin()

.then(ok=>{

if(ok){

loadOrders();

loadMenuItems();

}

});


</script>


</body>

</html>
