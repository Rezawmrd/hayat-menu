<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAYAT | پنل مدیریت</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Vazirmatn',sans-serif;
    background:#090909;
    color:#fff;
    min-height:100vh;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
    radial-gradient(circle at 20% 20%,rgba(212,175,55,.10),transparent 40%),
    radial-gradient(circle at 80% 70%,rgba(212,175,55,.07),transparent 45%);
}

.header{
    position:relative;
    z-index:1;
    padding:25px 18px;
    text-align:center;
    border-bottom:1px solid rgba(212,175,55,.25);
    background:rgba(10,10,10,.9);
}

.logo{
    width:75px;
    height:75px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #d4af37;
}

.header h1{
    margin:10px 0 3px;
    color:#d4af37;
}

.header p{
    margin:0;
    color:#888;
    font-size:13px;
}

.container{
    position:relative;
    z-index:1;
    width:min(1100px,100%);
    margin:auto;
    padding:20px;
}

.main-tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.main-tab{
    flex:1;
    padding:12px;
    background:#151515;
    color:#aaa;
    border:1px solid #333;
    border-radius:10px;
    font-family:inherit;
    cursor:pointer;
}

.main-tab.active{
    color:#d4af37;
    border-color:#d4af37;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.stat{
    background:#151515;
    border:1px solid #292929;
    border-radius:10px;
    padding:10px 15px;
}

.stat span{
    color:#888;
    font-size:12px;
}

.stat strong{
    display:block;
    color:#d4af37;
    font-size:20px;
}

button{
    font-family:inherit;
}

.refresh,
.logout{
    background:#151515;
    padding:10px 16px;
    border-radius:9px;
    cursor:pointer;
}

.refresh{
    color:#d4af37;
    border:1px solid #d4af37;
}

.logout{
    color:#e74c3c;
    border:1px solid #633;
}

.filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:15px;
}

.filter{
    background:#151515;
    color:#aaa;
    border:1px solid #333;
    border-radius:20px;
    padding:8px 15px;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
}

.filter.active{
    color:#d4af37;
    border-color:#d4af37;
}

.orders{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.order{
    background:#121212;
    border:1px solid #292929;
    border-radius:14px;
    padding:16px;
}

.order.new{
    border-right:3px solid #d4af37;
}

.order.preparing{
    border-right:3px solid #3498db;
}

.order.ready{
    border-right:3px solid #2ecc71;
}

.order.cancelled{
    border-right:3px solid #e74c3c;
}

.order-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

.order-id{
    color:#d4af37;
    font-weight:700;
}

.table{
    background:#1d1d1d;
    border:1px solid #333;
    border-radius:8px;
    padding:6px 10px;
}

.items{
    border-top:1px solid #292929;
    border-bottom:1px solid #292929;
    padding:8px 0;
    margin-bottom:12px;
}

.item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
}

.item-price{
    white-space:nowrap;
}

.total{
    display:flex;
    justify-content:space-between;
    font-size:17px;
}

.total strong{
    color:#d4af37;
}

.order-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:15px;
}

.status-btn{
    flex:1;
    min-width:120px;
    background:#181818;
    color:#ddd;
    border:1px solid #333;
    border-radius:8px;
    padding:9px;
    font-family:inherit;
    cursor:pointer;
}

.status-btn:hover{
    border-color:#d4af37;
    color:#d4af37;
}

.empty,
.loading{
    text-align:center;
    padding:50px;
    color:#777;
}

.toast{
    position:fixed;
    top:20px;
    right:50%;
    transform:translateX(50%);
    background:#171717;
    border:1px solid #d4af37;
    padding:12px 20px;
    border-radius:10px;
    opacity:0;
    transition:.3s;
    z-index:9999;
}

.toast.show{
    opacity:1;
}

/* ================= MENU ================= */

.menu-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.menu-title h2{
    color:#d4af37;
    margin:0;
}

.gold-btn{
    background:#d4af37;
    color:#090909;
    border:0;
    border-radius:9px;
    padding:10px 16px;
    font-weight:700;
    cursor:pointer;
}

.dark-btn{
    background:#151515;
    color:#ddd;
    border:1px solid #333;
    border-radius:8px;
    padding:9px 13px;
    cursor:pointer;
}

.dark-btn:hover{
    border-color:#d4af37;
    color:#d4af37;
}

.section-card{
    background:#121212;
    border:1px solid #292929;
    border-radius:14px;
    padding:15px;
    margin-bottom:15px;
}

.section-card.inactive{
    opacity:.55;
}

.section-main{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.section-name{
    color:#d4af37;
    font-size:18px;
    font-weight:700;
}

.section-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.subsections{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid #292929;
}

.subsection{
    background:#181818;
    border:1px solid #303030;
    border-radius:10px;
    padding:10px;
    margin-bottom:8px;
}

.subsection-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.sub-name{
    color:#eee;
    font-weight:600;
}

.items-box{
    margin-top:10px;
}

.menu-item{
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:10px;
    padding:12px;
    margin-top:8px;
}

.menu-item.inactive{
    opacity:.5;
}

.menu-item-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:center;
}

.menu-item-name{
    font-weight:600;
}

.menu-item-price{
    color:#d4af37;
    white-space:nowrap;
}

.menu-item-desc{
    color:#888;
    font-size:13px;
    margin-top:5px;
}

.menu-item-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:10px;
}

.small-btn{
    background:#151515;
    color:#ccc;
    border:1px solid #333;
    border-radius:7px;
    padding:7px 10px;
    cursor:pointer;
}

.small-btn:hover{
    border-color:#d4af37;
    color:#d4af37;
}

.danger-btn:hover{
    border-color:#e74c3c;
    color:#e74c3c;
}

.add-item-btn{
    width:100%;
    margin-top:8px;
    background:#111;
    color:#d4af37;
    border:1px dashed #d4af37;
    border-radius:9px;
    padding:10px;
    cursor:pointer;
    font-family:inherit;
}

.add-sub-btn{
    margin-top:10px;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:5000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(520px,100%);
    max-height:90vh;
    overflow-y:auto;
    background:#151515;
    border:1px solid #444;
    border-radius:16px;
    padding:20px;
}

.modal-box h3{
    color:#d4af37;
    margin-top:0;
}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    color:#aaa;
    margin-bottom:6px;
    font-size:13px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:11px;
    background:#090909;
    color:#fff;
    border:1px solid #333;
    border-radius:8px;
    font-family:inherit;
    outline:none;
}

.form-group textarea{
    min-height:80px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#d4af37;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.modal-actions button{
    flex:1;
}

.close-btn{
    background:#222;
    color:#aaa;
    border:1px solid #333;
    border-radius:8px;
    padding:10px;
    cursor:pointer;
}

.hidden{
    display:none !important;
}

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .main-tabs{
        gap:6px;
    }

    .main-tab{
        font-size:13px;
        padding:10px 5px;
    }

    .section-main{
        align-items:flex-start;
    }

    .section-actions{
        width:100%;
    }

    .section-actions button{
        flex:1;
    }

    .menu-item-head{
        align-items:flex-start;
    }

    .menu-item-actions button{
        flex:1;
    }
}
</style>
</head>

<body>

<header class="header">

<img
class="logo"
src="file_000000005f7471fdbdd33eefd3f2e476.png"
>

<h1>HAYAT COMPLEX</h1>

<p>
پنل مدیریت سفارش‌ها
</p>

</header>

<main class="container">

<div class="main-tabs">

<button
class="main-tab active"
onclick="showPanel('ordersPanel',this)"
>
📦 سفارش‌ها
</button>

<button
class="main-tab"
onclick="showPanel('menuPanel',this)"
>
🍽 مدیریت منو
</button>

</div>


<!-- ================= ORDERS ================= -->

<div id="ordersPanel">

<div class="top-bar">

<div class="stats">

<div class="stat">
<span>کل سفارش‌ها</span>
<strong id="totalOrders">0</strong>
</div>

<div class="stat">
<span>سفارش جدید</span>
<strong id="newOrders">0</strong>
</div>

<div class="stat">
<span>در حال آماده‌سازی</span>
<strong id="preparingOrders">0</strong>
</div>

</div>

<div style="display:flex;gap:8px;">

<button
class="refresh"
onclick="loadOrders()"
>
🔄 بروزرسانی
</button>

<button
class="logout"
onclick="logout()"
>
خروج
</button>

</div>

</div>


<div class="filters">

<button
class="filter active"
onclick="setFilter('all',this)"
>
همه
</button>

<button
class="filter"
onclick="setFilter('new',this)"
>
🟡 جدید
</button>

<button
class="filter"
onclick="setFilter('preparing',this)"
>
🔵 آماده‌سازی
</button>

<button
class="filter"
onclick="setFilter('ready',this)"
>
🟢 آماده شد
</button>

<button
class="filter"
onclick="setFilter('cancelled',this)"
>
🔴 لغو شده
</button>

</div>


<div id="orders" class="orders">

<div class="loading">
در حال دریافت سفارش‌ها...
</div>

</div>

</div>


<!-- ================= MENU ================= -->

<div id="menuPanel" style="display:none">

<div class="menu-title">

<h2>
🍽 مدیریت منو
</h2>

<button
class="gold-btn"
onclick="openAddMainSectionModal()"
>
➕ افزودن تب اصلی
</button>

</div>


<div id="menuSections">

<div class="loading">
در حال دریافت بخش‌های منو...
</div>

</div>

</div>


<div id="toast" class="toast"></div>

</main>


<!-- ================= MODAL ================= -->

<div id="modal" class="modal">

<div class="modal-box">

<h3 id="modalTitle">
مدیریت
</h3>

<div id="modalContent"></div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://lryoqddbyasdtjdrwpvx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_pZbQaJ78di1MH3PUcJfeyw_0vPl43k9";

const ADMIN_UID =
"c7916c81-caaa-4050-bcae-9d0546bebb96";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBAL
===================================================== */

let orders = [];
let currentFilter = "all";

let menuSections = [];
let menuItems = [];


/* =====================================================
   ADMIN CHECK
===================================================== */

async function checkAdmin(){

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();

    if(error || !data.session){

        window.location.href = "login.html";

        return false;
    }

    if(data.session.user.id !== ADMIN_UID){

        await supabaseClient.auth.signOut();

        window.location.href = "login.html";

        return false;
    }

    return true;
}


/* =====================================================
   ORDERS
===================================================== */

async function loadOrders(){

    if(!await checkAdmin()){
        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("orders")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );

    if(error){

        showToast("❌ دریافت سفارش‌ها انجام نشد");

        return;
    }

    orders = data || [];

    updateStats();

    renderOrders();
}


function updateStats(){

    document.getElementById("totalOrders").innerText =
        orders.length;

    document.getElementById("newOrders").innerText =
        orders.filter(
            o => o.status === "new"
        ).length;

    document.getElementById("preparingOrders").innerText =
        orders.filter(
            o => o.status === "preparing"
        ).length;
}


function setFilter(filter,btn){

    currentFilter = filter;

    document.querySelectorAll(".filter")
        .forEach(
            b => b.classList.remove("active")
        );

    btn.classList.add("active");

    renderOrders();
}


function renderOrders(){

    const container =
        document.getElementById("orders");

    let list = orders;

    if(currentFilter !== "all"){

        list = orders.filter(
            o => o.status === currentFilter
        );
    }

    if(list.length === 0){

        container.innerHTML = `
            <div class="empty">
                📋 سفارشی وجود ندارد
            </div>
        `;

        return;
    }

    container.innerHTML = "";

    list.forEach(order => {

        container.innerHTML +=
            createOrderHTML(order);

    });
}


function createOrderHTML(order){

    let items = "";

    (order.items || []).forEach(item => {

        items += `
            <div class="item">

                <div>

                    ${escapeHTML(item.name)}

                    <br>

                    <small>
                        تعداد:
                        ${item.quantity || 1}
                    </small>

                </div>

                <div class="item-price">

                    ${formatNumber(
                        (item.price || 0) *
                        (item.quantity || 1)
                    )}

                </div>

            </div>
        `;
    });


    return `

        <div class="order ${order.status}">

            <div class="order-head">

                <div>

                    <span class="order-id">
                        سفارش #${order.id}
                    </span>

                    <br>

                    <small>
                        ${formatDate(order.created_at)}
                    </small>

                </div>

                <div class="table">

                    🪑 میز:
                    ${escapeHTML(order.table_number)}

                </div>

            </div>


            <div class="items">

                ${items}

            </div>


            <div class="total">

                <span>
                    مبلغ کل
                </span>

                <strong>

                    ${formatNumber(order.total_price)}
                    تومان

                </strong>

            </div>


            <div class="order-actions">

                <button
                class="status-btn"
                onclick="changeStatus(${order.id},'new')"
                >
                    🟡 جدید
                </button>

                <button
                class="status-btn"
                onclick="changeStatus(${order.id},'preparing')"
                >
                    🔵 آماده‌سازی
                </button>

                <button
                class="status-btn"
                onclick="changeStatus(${order.id},'ready')"
                >
                    🟢 آماده شد
                </button>

                <button
                class="status-btn"
                onclick="changeStatus(${order.id},'cancelled')"
                >
                    🔴 لغو
                </button>

                <button
                class="status-btn"
                onclick="printInvoice(${order.id})"
                >
                    🖨 چاپ فاکتور
                </button>

                <button
                class="status-btn"
                onclick="deleteOrder(${order.id})"
                >
                    🗑 حذف
                </button>

            </div>

        </div>
    `;
}


async function changeStatus(id,status){

    const {
        error
    } = await supabaseClient
        .from("orders")
        .update({
            status:status
        })
        .eq("id",id);

    if(error){

        showToast("❌ تغییر وضعیت نشد");

        return;
    }

    let order =
        orders.find(
            o => o.id === id
        );

    if(order){

        order.status = status;
    }

    updateStats();

    renderOrders();

    showToast("✅ وضعیت تغییر کرد");
}


async function deleteOrder(id){

    if(!confirm("حذف این سفارش؟"))
        return;

    const {
        error
    } = await supabaseClient
        .from("orders")
        .delete()
        .eq("id",id);

    if(error){

        showToast("❌ حذف نشد");

        return;
    }

    orders =
        orders.filter(
            o => o.id !== id
        );

    updateStats();

    renderOrders();

    showToast("🗑 حذف شد");
}


/* =====================================================
   MENU SECTIONS
===================================================== */

async function loadMenu(){

    const {
        data:sections,
        error:sectionError
    } = await supabaseClient
        .from("menu_sections")
        .select("*")
        .order("sort_order",{ascending:true});

    if(sectionError){

        console.error(sectionError);

        showToast("❌ دریافت تب‌های منو انجام نشد");

        return;
    }


    const {
        data:items,
        error:itemError
    } = await supabaseClient
        .from("menu_items")
        .select("*")
        .order("id",{ascending:true});

    if(itemError){

        console.error(itemError);

        showToast("❌ دریافت آیتم‌های منو انجام نشد");

        return;
    }


    menuSections = sections || [];

    menuItems = items || [];

    renderMenu();
}


/* =====================================================
   RENDER MENU
===================================================== */

function renderMenu(){

    const container =
        document.getElementById("menuSections");

    if(!container)
        return;


    const mains =
        menuSections.filter(
            s => !s.parent_id
        );


    if(mains.length === 0){

        container.innerHTML = `
            <div class="empty">
                هیچ تب اصلی وجود ندارد.
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    mains.forEach(main => {

        const children =
            menuSections
                .filter(
                    s => s.parent_id === main.id
                )
                .sort(
                    (a,b) =>
                    Number(a.sort_order || 0) -
                    Number(b.sort_order || 0)
                );


        const mainItems =
            menuItems.filter(
                item =>
                    item.category === main.name &&
                    !item.subcategory
            );


        let childrenHTML = "";


        children.forEach(child => {

            const childItems =
                menuItems.filter(
                    item =>
                        item.category === main.name &&
                        item.subcategory === child.name
                );


            childrenHTML += `

                <div class="subsection">

                    <div class="subsection-head">

                        <div class="sub-name">

                            ${escapeHTML(child.name)}

                            ${
                                child.active
                                ? ""
                                : " — غیرفعال"
                            }

                        </div>


                        <div class="section-actions">

                            <button
                            class="small-btn"
                            onclick="editSection('${child.id}')"
                            >
                                ✏️ ویرایش
                            </button>

                            <button
                            class="small-btn"
                            onclick="toggleSection('${child.id}',${child.active})"
                            >
                                ${
                                    child.active
                                    ? "⏸ غیرفعال"
                                    : "▶️ فعال"
                                }
                            </button>

                            <button
                            class="small-btn danger-btn"
                            onclick="deleteSection('${child.id}')"
                            >
                                🗑 حذف
                            </button>

                        </div>

                    </div>


                    <div class="items-box">

                        ${
                            renderItemsHTML(
                                childItems,
                                main.name,
                                child.name
                            )
                        }


                        <!-- مهم:

async function addMainSection(){

    const name =
        document
        .getElementById("newMainName")
        .value
        .trim();


    if(!name){

        showToast("⚠️ نام تب را وارد کنید");

        return;
    }


    const duplicate =
        menuSections.some(
            s =>
                !s.parent_id &&
                s.name === name
        );


    if(duplicate){

        showToast("⚠️ این تب قبلاً وجود دارد");

        return;
    }


    const mainSections =
        menuSections.filter(
            s => !s.parent_id
        );


    const maxSort =
        mainSections.length
        ? Math.max(
            ...mainSections.map(
                s => Number(s.sort_order || 0)

        : 0;


    const {
        error

        .from("menu_sections")
        .insert({
            name:name,
            parent_id:null,
            sort_order:maxSort + 1,
            active:true
        });


    if(error){

        console.error(error);

        showToast("❌ افزودن تب انجام نشد");

        return;
    }


    closeModal();

    showToast("✅ تب اصلی اضافه شد");

    await loadMenu();

async function saveSectionEdit(id){

    const section =
        menuSections.find(
            s => s.id === id
        );

    if(!section)
        return;


    const newName =
        document
        .getElementById("editSectionName")
        .value
        .trim();


    if(!newName){

        showToast("⚠️ نام را وارد کنید");

        return;
    }


    if(newName === section.name){

        closeModal();

        return;
    }


    const duplicate =
        menuSections.some(
            s =>
                s.id !== id &&
                s.parent_id === section.parent_id &&
                s.name === newName
        );


    if(duplicate){

        showToast("⚠️ این نام قبلاً وجود دارد");

        return;
    }


    if(!section.parent_id){

        const {
            error:itemError
        } = await supabaseClient
            .from("menu_items")
            .update({
                category:newName
            })
            .eq("category",section.name);


        if(itemError){

            console.error(itemError);

            showToast("❌ آیتم‌های این تب به‌روزرسانی نشدند");

            return;
        }

    }else{

        const parent =
            menuSections.find(
                s => s.id === section.parent_id
            );


        if(parent){

            const {
                error:itemError
            } = await supabaseClient
                .from("menu_items")
                .update({
                    subcategory:newName
                })
                .eq("category",parent.name)
                .eq("subcategory",section.name);


            if(itemError){

                console.error(itemError);

                showToast("❌ آیتم‌های زیرتب به‌روزرسانی نشدند");

                return;
            }
        }
    }


    const {
        error
    } = await supabaseClient
        .from("menu_sections")
        .update({
            name:newName
        })
        .eq("id",id);


    if(error){

        console.error(error);

        showToast("❌ تغییر نام انجام نشد");

        return;
    }


    closeModal();

    showToast("✅ نام تغییر کرد");

    await loadMenu();
}

/* =====================================================
   DELETE SECTION
===================================================== */

async function deleteSection(id){

    const section =
        menuSections.find(
            s => s.id === id
        );

    if(!section)
        return;


    const children =
        menuSections.filter(
            s => s.parent_id === id
        );


    if(children.length > 0){

        showToast(
            "⚠️ اول زیرتب‌های این بخش را حذف کنید"
        );

        return;
    }


    let query =
        supabaseClient
        .from("menu_items")
        .select("id",{count:"exact",head:true});


    if(section.parent_id){

        const parent =
            menuSections.find(
                s => s.id === section.parent_id
            );

        if(parent){

            query =
                query
                .eq("category",parent.name)
                .eq("subcategory",section.name);
        }

    }else{

        query =
            query
            .eq("category",section.name);
    }


    const {
        count,
        error:countError
    } = await query;


    if(countError){

        console.error(countError);

        showToast("❌ بررسی آیتم‌ها انجام نشد");

        return;
    }


    if(count > 0){

        showToast(
            "⚠️ این تب آیتم دارد و قابل حذف نیست"
        );

        return;
    }


    if(!confirm(
        `تب «${section.name}» حذف شود؟`
    )){
        return;
    }


    const {
        error
    } = await supabaseClient
        .from("menu_sections")
        .delete()
        .eq("id",id);


    if(error){

        console.error(error);

        showToast("❌ حذف تب انجام نشد");

        return;
    }


    showToast("🗑 تب حذف شد");

    await loadMenu();
}

async function addMenuItem(mainId,subId){

    const main =
        menuSections.find(
            s => s.id === mainId
        );

    if(!main)
        return;


    const sub =
        subId
        ? menuSections.find(
            s => s.id === subId
        )
        : null;


    const name =
        document
        .getElementById("newItemName")
        .value
        .trim();


    const price =
        Number(
            document
            .getElementById("newItemPrice")
            .value
        );


    const description =
        document
        .getElementById("newItemDescription")
        .value
        .trim();


    const sortOrder =
        Number(
            document
            .getElementById("newItemSort")
            .value
        ) || 0;


    if(!name){

        showToast("⚠️ نام آیتم را وارد کنید");

        return;
    }


    if(!price || price < 0){

        showToast("⚠️ قیمت را وارد کنید");

        return;
    }


    const existing =
        menuItems.some(
            item =>
                item.name === name &&
                item.category === main.name &&
                (item.subcategory || "") ===
                (sub ? sub.name : "")
        );


    if(existing){

        showToast("⚠️ این آیتم قبلاً وجود دارد");

        return;
    }


    const itemData = {

        name:name,

        price:price,

        category:main.name,

        subcategory:
            sub
            ? sub.name
            : null,

        description:
            description
            ? description
            : null,

        active:true,

        sort_order:sortOrder

    };


    const {
        error
    } = await supabaseClient
        .from("menu_items")
        .insert(itemData);


    if(error){

        console.error(error);

        showToast(
            "❌ افزودن آیتم انجام نشد"
        );

        return;
    }


    closeModal();

    showToast("✅ آیتم اضافه شد");

    await loadMenu();
}

   MODAL
===================================================== */

function openModal(title,content){

    document.getElementById("modalTitle")
        .innerText = title;

    document.getElementById("modalContent")
        .innerHTML = content;

    document.getElementById("modal")
        .classList.add("show");


    setTimeout(() => {

        const input =
            document.querySelector(
                "#modalContent input"
            );

        if(input)
            input.focus();

    },100);
}


function closeModal(){

    document.getElementById("modal")
        .classList.remove("show");

    document.getElementById("modalContent")
        .innerHTML = "";
}


document.getElementById("modal")
.addEventListener(
    "click",
    function(e){

        if(e.target === this){
            closeModal();
        }

    }
);


/* =====================================================
   HELPERS
===================================================== */

function formatNumber(num){

    return Number(num || 0)
        .toLocaleString("fa-IR");
}


function formatDate(date){

    if(!date)
        return "";

    return new Date(date)
        .toLocaleString("fa-IR");
}


function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function escapeAttribute(value){

    return escapeHTML(value);
}


function showToast(msg){

    const toast =
        document.getElementById("toast");

    toast.innerText = msg;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    },2500);
}

/* =====================================================
   PRINT
===================================================== */

function printInvoice(id){

    const order =
        orders.find(
            o => o.id === id
        );

    if(!order)
        return;


    let rows = "";


    (order.items || []).forEach(item => {

        rows += `

            <tr>

                <td>
                    ${escapeHTML(item.name)}
                </td>

                <td>
                    ${item.quantity || 1}
                </td>

                <td>
                    ${formatNumber(
                        item.price *
                        (item.quantity || 1)
                    )}
                </td>

            </tr>

        `;

    });


    let win =
        window.open(
            "",
            "_blank",
            "width=350,height=600"
        );


    if(!win){

        showToast(
            "⚠️ پنجره چاپ توسط مرورگر مسدود شد"
        );

        return;
    }


    win.document.write(`

        <html lang="fa" dir="rtl">

        <head>

            <meta charset="UTF-8">

            <style>

                body{
                    font-family:tahoma;
                    width:80mm;
                    text-align:center;
                }

                table{
                    width:100%;
                    border-collapse:collapse;
                }

                td{
                    padding:5px;
                    border-bottom:1px dashed #999;
                }

            </style>

        </head>

        <body>

            <h2>
                HAYAT COMPLEX
            </h2>

            <p>
                سفارش #${order.id}
            </p>

            <p>
                میز ${escapeHTML(order.table_number)}
            </p>

            <hr>

            <table>

                ${rows}

            </table>

            <hr>

            <h3>

                ${formatNumber(order.total_price)}
                تومان

            </h3>

        </body>

        </html>

    `);


    win.document.close();


    setTimeout(() => {

        win.print();

        win.close();

    },500);
}
