<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://lryoqddbyasdtjdrwpvx.supabase.co";


const SUPABASE_KEY =
"sb_publishable_pZbQaJ78di1MH3PUcJfeyw_0vPl43k9";


const ADMIN_UID =
"c7916c81-caaa-4050-bcae-9d0546bebb96";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =====================================================
   GLOBALS
===================================================== */

let orders = [];

let currentFilter = "all";

let categories = [];

let menuItems = [];

let selectedCategoryId = null;

let editingCategoryId = null;


/* =====================================================
   ADMIN CHECK
===================================================== */

async function checkAdmin(){

const {
data,
error
} =
await supabaseClient.auth.getSession();


if(
error ||
!data.session
){

window.location.href =
"login.html";

return false;

}


if(
data.session.user.id !== ADMIN_UID
){

await supabaseClient.auth.signOut();

window.location.href =
"login.html";

return false;

}


return true;

}


/* =====================================================
   ORDERS
===================================================== */

async function loadOrders(){

if(
!await checkAdmin()
){
return;
}


const {
data,
error
} =
await supabaseClient

.from("orders")

.select("*")

.order(
"created_at",
{
ascending:false
}
);


if(error){
    console.error("MENU CATEGORIES ERROR:", error);
    showToast("❌ خطا: " + (error.message || "نامشخص"));
    alert(
        "خطای دریافت تب‌ها:\n\n" +
        (error.message || "نامشخص") +
        "\n\nکد خطا: " +
        (error.code || "ندارد")
    );
    return;
}


orders = data || [];


updateStats();

renderOrders();

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

document.getElementById(
"totalOrders"
).innerText =
orders.length;


document.getElementById(
"newOrders"
).innerText =
orders.filter(
o => o.status === "new"
).length;


document.getElementById(
"preparingOrders"
).innerText =
orders.filter(
o => o.status === "preparing"
).length;

}


/* =====================================================
   FILTER
===================================================== */

function setFilter(
filter,
btn
){

currentFilter =
filter;


document
.querySelectorAll(".filter")
.forEach(
b =>
b.classList.remove("active")
);


btn.classList.add("active");


renderOrders();

}


/* =====================================================
   RENDER ORDERS
===================================================== */

function renderOrders(){

const container =
document.getElementById(
"orders"
);


let list =
orders;


if(
currentFilter !== "all"
){

list =
orders.filter(

});

);

);

/* =====================================================
   FORMAT NUMBER
===================================================== */

function formatNumber(num){

return Number(
num || 0
)
.toLocaleString("fa-IR");

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date){

if(!date)
return "";


return new Date(date)
.toLocaleString(
"fa-IR"
);

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
